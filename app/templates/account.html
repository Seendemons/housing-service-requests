<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Личный кабинет</title></head>
<body><main>
<h1>Личный кабинет</h1>
<p>Логин: {{ user.login }}</p>
<p>Роль: {% if user.role.value == 'resident' %}житель{% else %}диспетчер{% endif %}</p>
<form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Выйти</button>
</form>
<p><a href="/">На главную</a></p>
</main></body></html>
