<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход</title></head>
<body><main>
<h1>Вход</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label>Логин <input name="login" autocomplete="username" required></label></p>
    <p><label>Пароль <input type="password" name="password" autocomplete="current-password" required></label></p>
    <button type="submit">Войти</button>
</form>
<p><a href="/">На главную</a></p>
</main></body></html>
